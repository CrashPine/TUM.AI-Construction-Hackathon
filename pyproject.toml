[project]
name = "boqcheck"
version = "0.1.0"
description = "Find errors and risks in German bills of quantities (LV)"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.26,<2"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pydoclint>=0.12.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
# Dataclass fields are instance attributes, documented with :ivar: in the class docstring.
only-attrs-with-classvar-are-treated-as-class-attrs = true
